- block:
  - set_fact:
      vhost_name: /test

  - name: Add host
    community.rabbitmq.rabbitmq_vhost:
      name: "{{ vhost_name }}"
      state: present
    register: result

  - name: Check that the host was created successfuly
    shell: "rabbitmqctl list_vhosts name tracing | grep {{ vhost_name }}"
    register: ctl_result

  - name: Check that the host is added
    assert:
      that:
        - result is changed
        - result is success
        - '"false" in ctl_result.stdout'  # value for tracing, false is disabled

  - name: Add host (idempotency)
    community.rabbitmq.rabbitmq_vhost:
      name: "{{ vhost_name }}"
      state: present
    register: result

  - name: Check idempotency
    assert:
      that:
        - result is not changed

  - name: Enable tracing
    community.rabbitmq.rabbitmq_vhost:
      name: "{{ vhost_name }}"
      tracing: yes
    register: result

  - name: Get rabbitmqctl output
    shell: "rabbitmqctl list_vhosts name tracing | grep {{ vhost_name }}"
    register: ctl_result

  - name: Check that tracing is enabled
    assert:
      that:
        - result is changed
        - result is success
        - '"true" in ctl_result.stdout'  # value for tracing, true is enabled

  - name: Enable tracing (idempotency)
    community.rabbitmq.rabbitmq_vhost:
      name: "{{ vhost_name }}"
      tracing: yes
    register: result

  - name: Check idempotency
    assert:
      that:
        - result is not changed

  - name: Disable tracing
    community.rabbitmq.rabbitmq_vhost:
      name: "{{ vhost_name }}"
      tracing: no
    register: result

  - name: Get rabbitmqctl output
    shell: "rabbitmqctl list_vhosts name tracing | grep {{ vhost_name }}"
    register: ctl_result

  - name: Check that tracing is disabled
    assert:
      that:
        - result is changed
        - result is success
        - '"false" in ctl_result.stdout'  # value for tracing, false is disabled

  - name: Disable tracing (idempotency)
    community.rabbitmq.rabbitmq_vhost:
      name: "{{ vhost_name }}"
      tracing: no
    register: result

  - name: Check idempotency
    assert:
      that:
        - result is not changed

  - name: Remove host
    community.rabbitmq.rabbitmq_vhost:
      name: "{{ vhost_name }}"
      state: absent
    register: result

  - name: Get rabbitmqctl output
    shell: "rabbitmqctl list_vhosts name tracing | grep {{ vhost_name }}"
    register: ctl_result
    failed_when: ctl_result.rc == 0

  - name: Check that the host is removed
    assert:
      that:
        - result is changed
        - result is success

  - name: Remove host (idempotency)
    community.rabbitmq.rabbitmq_vhost:
      name: "{{ vhost_name }}"
      state: absent
    register: result

  - name: Check idempotency
    assert:
      that:
        - result is not changed

  - name: Add host with a default queue type
    community.rabbitmq.rabbitmq_vhost:
      name: /test_quorum
      default_queue_type: quorum
      state: present
    register: result

  - name: Get rabbitmqctl output for the default queue type
    shell: "rabbitmqctl list_vhosts name default_queue_type | grep /test_quorum"
    register: ctl_result

  - name: Check that the host was created with the quorum default queue type
    assert:
      that:
        - result is changed
        - result is success
        - '"quorum" in ctl_result.stdout'

  - name: Add host with a default queue type (idempotency)
    community.rabbitmq.rabbitmq_vhost:
      name: /test_quorum
      default_queue_type: quorum
      state: present
    register: result

  - name: Check idempotency
    assert:
      that:
        - result is not changed

  always:
    - name: Remove host
      community.rabbitmq.rabbitmq_vhost:
        name: "{{ vhost_name }}"
        state: absent

    - name: Remove host with a default queue type
      community.rabbitmq.rabbitmq_vhost:
        name: /test_quorum
        state: absent
