---

- name: Set facts for PR 219 regression test
  set_fact:
    pr219_user: pr219_test_user
    pr219_initial_password: initial_password
    pr219_updated_password: updated_password

- name: Test API user password and tag updates
  block:
    - name: Ensure PR 219 test user is absent
      rabbitmq_user:
        user: "{{ pr219_user }}"
        state: absent
        login_user: guest
        login_password: guest
        login_host: 127.0.0.1

    - name: Create PR 219 test user
      rabbitmq_user:
        user: "{{ pr219_user }}"
        password: "{{ pr219_initial_password }}"
        tags: management
        vhost: /
        configure_priv: .*
        write_priv: .*
        read_priv: .*
        state: present
        update_password: always
        login_user: guest
        login_password: guest
        login_host: 127.0.0.1
      register: pr219_create_user

    - name: Check that creating the PR 219 test user succeeds with a change
      assert:
        that:
          - pr219_create_user.changed == true

    - name: Run the same PR 219 user task again
      rabbitmq_user:
        user: "{{ pr219_user }}"
        password: "{{ pr219_initial_password }}"
        tags: management
        vhost: /
        configure_priv: .*
        write_priv: .*
        read_priv: .*
        state: present
        update_password: always
        login_user: guest
        login_password: guest
        login_host: 127.0.0.1
      register: pr219_repeat_user

    - name: Check that the repeated PR 219 user task is idempotent
      assert:
        that:
          - pr219_repeat_user.changed == false

    - name: Update the PR 219 test user's password
      rabbitmq_user:
        user: "{{ pr219_user }}"
        password: "{{ pr219_updated_password }}"
        tags: management
        vhost: /
        configure_priv: .*
        write_priv: .*
        read_priv: .*
        state: present
        update_password: always
        login_user: guest
        login_password: guest
        login_host: 127.0.0.1
      register: pr219_update_password

    - name: Check that updating the PR 219 test user's password succeeds with a change
      assert:
        that:
          - pr219_update_password.changed == true

    - name: Update the PR 219 test user's tags
      rabbitmq_user:
        user: "{{ pr219_user }}"
        password: "{{ pr219_updated_password }}"
        tags: monitoring,management
        vhost: /
        configure_priv: .*
        write_priv: .*
        read_priv: .*
        state: present
        update_password: always
        login_user: guest
        login_password: guest
        login_host: 127.0.0.1
      register: pr219_update_tags

    - name: Check that updating the PR 219 test user's tags succeeds with a change
      assert:
        that:
          - pr219_update_tags.changed == true

  always:
    - name: Remove PR 219 test user
      rabbitmq_user:
        user: "{{ pr219_user }}"
        state: absent
        login_user: guest
        login_password: guest
        login_host: 127.0.0.1
