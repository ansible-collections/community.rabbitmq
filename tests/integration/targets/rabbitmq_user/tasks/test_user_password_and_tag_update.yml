---

- name: Set facts for user password and tag update test
  set_fact:
    user_update_test_user: user_update_test_user
    user_update_initial_password: initial_password
    user_update_updated_password: updated_password

- name: Test API user password and tag updates
  block:
    - name: Ensure user password and tag update test user is absent
      rabbitmq_user:
        user: "{{ user_update_test_user }}"
        state: absent
        login_user: guest
        login_password: guest
        login_host: 127.0.0.1

    - name: Create user password and tag update test user
      rabbitmq_user:
        user: "{{ user_update_test_user }}"
        password: "{{ user_update_initial_password }}"
        tags: management
        vhost: /
        configure_priv: .*
        write_priv: .*
        read_priv: .*
        state: present
        update_password: always
        login_user: guest
        login_password: guest
        login_host: 127.0.0.1
      register: user_update_create_user

    - name: Check that creating the user password and tag update test user succeeds with a change
      assert:
        that:
          - user_update_create_user.changed == true

    - name: Run the same user password and tag update task again
      rabbitmq_user:
        user: "{{ user_update_test_user }}"
        password: "{{ user_update_initial_password }}"
        tags: management
        vhost: /
        configure_priv: .*
        write_priv: .*
        read_priv: .*
        state: present
        update_password: always
        login_user: guest
        login_password: guest
        login_host: 127.0.0.1
      register: user_update_repeat_user

    - name: Check that the repeated user password and tag update task is idempotent
      assert:
        that:
          - user_update_repeat_user.changed == false

    - name: Update the user password and tag update test user's password
      rabbitmq_user:
        user: "{{ user_update_test_user }}"
        password: "{{ user_update_updated_password }}"
        tags: management
        vhost: /
        configure_priv: .*
        write_priv: .*
        read_priv: .*
        state: present
        update_password: always
        login_user: guest
        login_password: guest
        login_host: 127.0.0.1
      register: user_update_password

    - name: Check that updating the test user's password succeeds with a change
      assert:
        that:
          - user_update_password.changed == true

    - name: Update the user password and tag update test user's tags
      rabbitmq_user:
        user: "{{ user_update_test_user }}"
        password: "{{ user_update_updated_password }}"
        tags: monitoring,management
        vhost: /
        configure_priv: .*
        write_priv: .*
        read_priv: .*
        state: present
        update_password: always
        login_user: guest
        login_password: guest
        login_host: 127.0.0.1
      register: user_update_tags

    - name: Check that updating the test user's tags succeeds with a change
      assert:
        that:
          - user_update_tags.changed == true

  always:
    - name: Remove user password and tag update test user
      rabbitmq_user:
        user: "{{ user_update_test_user }}"
        state: absent
        login_user: guest
        login_password: guest
        login_host: 127.0.0.1
