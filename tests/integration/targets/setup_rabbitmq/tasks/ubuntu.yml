---
# https://stackoverflow.com/questions/25193161/chfn-pam-system-error-intermittently-in-docker-hub-builds/25267015
- name: Disable chfn
  ansible.builtin.file:
    path: /usr/bin/chfn
    src: /bin/true
    state: link
    force: true

# https://www.rabbitmq.com/install-debian.html#apt-pinning
- name: Install Essential Dependencies
  ansible.builtin.apt:
    name:
      - gnupg
      - debian-keyring
      - debian-archive-keyring
      - apt-transport-https
      - python3-apt
      # Required by the rabbitmq modules that uses the management API
      - python3-requests
      # Required by the deb822_repository role
      - python3-debian
    state: present
    force: true

# Install the RabbitMQ APT repositories.
# https://www.rabbitmq.com/blog/2025/07/16/debian-apt-repositories-are-moving
- name: Add RabbitMQ Erlang repository
  ansible.builtin.deb822_repository:
    name: rabbitmq-erlang
    state: present
    types: deb
    uris: "{{ repository_url }}"
    suites: "{{ ansible_facts.distribution_release }}"
    components: main
    architectures: amd64
    signed_by: https://keys.openpgp.org/vks/v1/by-fingerprint/0A9AF2115F4687BD29803A206B73A36E6026DFCA
  loop:
    - "https://deb1.rabbitmq.com/rabbitmq-erlang/ubuntu/{{ ansible_facts.distribution_release }}"
    - "https://deb2.rabbitmq.com/rabbitmq-erlang/ubuntu/{{ ansible_facts.distribution_release }}"
  loop_control:
    loop_var: repository_url

- name: Add RabbitMQ Server repository
  ansible.builtin.deb822_repository:
    name: rabbitmq-server
    state: present
    types: deb
    uris: "{{ repository_url }}"
    suites: "{{ ansible_facts.distribution_release }}"
    components: main
    architectures: amd64
    signed_by: https://keys.openpgp.org/vks/v1/by-fingerprint/0A9AF2115F4687BD29803A206B73A36E6026DFCA
  loop:
    - "https://deb1.rabbitmq.com/rabbitmq-server/ubuntu/{{ ansible_facts.distribution_release }}"
    - "https://deb2.rabbitmq.com/rabbitmq-server/ubuntu/{{ ansible_facts.distribution_release }}"
  loop_control:
    loop_var: repository_url

- name: Update the Apt cache
  ansible.builtin.apt:
    update_cache: true

# Ubuntu > 22.04 uses libssl version > 3
- name: Select version of libbssl to use
  ansible.builtin.set_fact:
    ssl_ver: "{{ 'libssl3' if ansible_distribution_major_version >= '22' else 'libssl1.1' }}"

- name: Install RabbitMQ Erlang dependencies
  ansible.builtin.apt:
    name:
      # Make sure libcrypto new enough for erlang
      - "{{ ssl_ver }}"
      # Base
      - erlang-base
      # TLS
      - erlang-asn1
      - erlang-crypto
      - erlang-public-key
      - erlang-ssl
      # etc (maybe not needed?)
      - erlang-mnesia
      - erlang-os-mon
      - erlang-parsetools
      - erlang-runtime-tools
      - erlang-snmp
      - erlang-syntax-tools
      - erlang-tftp
      - erlang-tools
      - erlang-xmerl
    state: latest  # noqa: package-latest

- name: Install RabbitMQ Server
  ansible.builtin.apt:
    name: rabbitmq-server
    state: fixed
    # policy.rc.d => do not start the service yet
    policy_rc_d: 101

- name: Ensure TLS config
  ansible.builtin.copy:
    src: rabbitmq.conf
    dest: /etc/rabbitmq/rabbitmq.conf

- name: Start RabbitMQ service
  ansible.builtin.service:
    name: rabbitmq-server
    state: started

- name: Enable management
  ansible.builtin.command: rabbitmq-plugins enable --online rabbitmq_management
  changed_when: false
